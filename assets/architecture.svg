<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="560" viewBox="0 0 1680 560" role="img" aria-labelledby="title desc">
  <title id="title">SiYuan Sisyphus architecture</title>
  <desc id="desc">External AI agents access the SiYuan workspace through Sisyphus aggregate tools or the official MCP bridge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#fb7185"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <style>
      .node { fill:#252a34; stroke:#475569; stroke-width:2; filter:url(#shadow) }
      .primary { fill:#1e3a5f; stroke:#3b82f6 }
      .workspace { fill:#172033; stroke:#64748b }
      .risk { fill:#35252b; stroke:#fb7185 }
      .label { fill:#fff; font:700 23px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-anchor:middle }
      .sub { fill:#dbe4f0; font:17px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-anchor:middle }
      .tiny { fill:#dbe4f0; font:15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-anchor:middle }
      .edge { fill:none; stroke:#94a3b8; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow) }
      .risk-edge { fill:none; stroke:#fb7185; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:8 7; marker-end:url(#arrow-risk) }
      .edge-label { fill:#be123c; font:700 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-anchor:middle }
    </style>
  </defs>

  <!-- Edges -->
  <path class="edge" d="M250 260H340"/>
  <path class="edge" d="M570 260H625Q640 260 640 245V140Q640 125 655 125H700"/>
  <path class="edge" d="M570 260H625Q640 260 640 275V300Q640 315 655 315H700"/>
  <path class="edge" d="M940 315H990Q1005 315 1005 300V295Q1005 280 1020 280H1060"/>
  <path class="risk-edge" d="M940 315H990Q1005 315 1005 330V430Q1005 445 1020 445H1060"/>
  <path class="edge" d="M940 125C1150 125 1290 245 1415 245H1450"/>
  <path class="edge" d="M1300 280C1360 280 1380 265 1410 265H1450"/>
  <path class="edge" d="M1300 445C1390 445 1370 285 1410 285H1450"/>

  <rect x="834" y="382" width="136" height="30" rx="15" fill="#fff1f2" stroke="#fecdd3"/>
  <text class="edge-label" x="902" y="402">high-risk option</text>

  <!-- Nodes -->
  <g>
    <rect class="node" x="30" y="205" width="220" height="110" rx="14"/>
    <text class="label" x="140" y="250">External AI agents</text>
    <text class="tiny" x="140" y="282">Claude · Codex · Cursor · …</text>
  </g>

  <g>
    <rect class="node primary" x="340" y="205" width="230" height="110" rx="14"/>
    <text class="label" x="455" y="250">SiYuan Sisyphus</text>
    <text class="sub" x="455" y="282">MCP + CLI</text>
  </g>

  <g>
    <rect class="node" x="700" y="70" width="240" height="110" rx="14"/>
    <text class="label" x="820" y="115">Aggregate tools</text>
    <text class="sub" x="820" y="147">Compatible workflows</text>
  </g>

  <g>
    <rect class="node" x="700" y="260" width="240" height="110" rx="14"/>
    <text class="label" x="820" y="305">extension</text>
    <text class="sub" x="820" y="337">Official MCP bridge</text>
  </g>

  <g>
    <rect class="node" x="1060" y="225" width="240" height="110" rx="14"/>
    <text class="label" x="1180" y="270">Other plugin tools</text>
    <text class="sub" x="1180" y="302">Enabled by default</text>
  </g>

  <g>
    <rect class="node risk" x="1060" y="390" width="240" height="110" rx="14"/>
    <text class="label" x="1180" y="435">Native MCP tools</text>
    <text class="sub" x="1180" y="467">Optional, off by default</text>
  </g>

  <g>
    <rect class="node workspace" x="1450" y="205" width="190" height="110" rx="14"/>
    <text class="label" x="1545" y="250">SiYuan</text>
    <text class="label" x="1545" y="282">workspace</text>
  </g>
</svg>
