  <text x="915" y="143" fill="#777" font-family="sans-serif" font-size="18">→</text>
  <rect x="950" y="108" width="225" height="62" rx="5" fill="#232323" stroke="#3a3a3a"/>
  <text x="964" y="128" fill="#929292" font-family="sans-serif" font-size="10">当前状态</text><text x="964" y="151" fill="#ddd" font-family="sans-serif" font-size="12">2026-08-05 17:55</text>
  <rect x="650" y="193" width="525" height="54" rx="4" fill="#2b2020"/>
  <text x="664" y="218" fill="#e46666" font-family="monospace" font-size="12">- 组合时间线与 Diff 面板</text><text x="664" y="237" fill="#c65d5d" font-family="monospace" font-size="11">- 右侧同时承担节点管理</text>
  <rect x="650" y="254" width="525" height="73" rx="4" fill="#1d3024"/>
  <text x="664" y="279" fill="#54b879" font-family="monospace" font-size="12">+ 左侧文档快照独立管理节点</text><text x="664" y="299" fill="#54b879" font-family="monospace" font-size="11">+ 点击节点后按需打开右侧 Diff</text><text x="664" y="318" fill="#54b879" font-family="monospace" font-size="11">+ 创建节点不会打断当前对比</text>
  <rect x="650" y="341" width="525" height="40" rx="4" fill="#252525"/>
  <text x="664" y="366" fill="#aaa" font-family="monospace" font-size="11">  文档节点与全局节点继续按时间混合排列</text>
